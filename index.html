<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        #ff6ec4,
        #7873f5,
        #4facfe
      );
      color: white;
    }

    /* Background glow */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      z-index: -1;
    }

    body::before {
      background: #ffeb3b;
      top: -80px;
      left: -80px;
    }

    body::after {
      background: #00ffcc;
      bottom: -80px;
      right: -80px;
    }

    .card {
      width: min(90%, 600px);
      padding: 45px 25px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      animation: cardIn 1s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .cake {
      font-size: 75px;
      animation: bounce 1.5s infinite alternate;
    }

    @keyframes bounce {
      from {
        transform: translateY(0) rotate(-3deg);
      }
      to {
        transform: translateY(-12px) rotate(3deg);
      }
    }

    h1 {
      margin-top: 10px;
      font-size: clamp(2.5rem, 10vw, 5rem);
      line-height: 1;
      color: #fff;
      text-shadow:
        0 0 10px #fff,
        0 0 25px #ff69b4,
        0 0 50px #ff69b4;
    }

    .name {
      margin-top: 15px;
      font-size: clamp(1.7rem, 6vw, 3rem);
      font-weight: bold;
      color: #ffe66d;
      text-shadow: 0 0 15px rgba(255, 230, 109, 0.8);
    }

    .message {
      margin: 25px auto;
      max-width: 480px;
      font-size: 1.1rem;
      line-height: 1.7;
      color: #fff;
    }

    button {
      border: none;
      outline: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      box-shadow: 0 8px 25px rgba(255, 65, 108, 0.45);
      transition: 0.3s ease;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 35px rgba(255, 65, 108, 0.65);
    }

    button:active {
      transform: scale(0.95);
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      pointer-events: none;
      z-index: 10;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Floating balloons */
    .balloon {
      position: fixed;
      bottom: -120px;
      font-size: 55px;
      animation: floatUp linear infinite;
      opacity: 0.8;
      z-index: -1;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-120vh);
      }
    }

    @media (max-width: 500px) {
      .card {
        padding: 35px 20px;
        border-radius: 25px;
      }

      .cake {
        font-size: 60px;
      }

      .message {
        font-size: 1rem;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <!-- Change the name here -->
    <div class="name">Dear Alex 💖</div>

    <p class="message">
      Wishing you a day filled with happiness, laughter, love,
      and unforgettable memories. May this new year of your life
      bring you closer to all your dreams! ✨
      <br><br>
      Have an amazing birthday! 🥳🎉
    </p>

    <button onclick="celebrate()">
      🎉 Celebrate!
    </button>
  </div>

  <script>
    const colors = [
      "#ff4d6d",
      "#ffd166",
      "#06d6a0",
      "#4cc9f0",
      "#f72585",
      "#ffffff",
      "#9b5de5"
    ];

    function createConfetti() {
      const confetti = document.createElement("div");

      confetti.classList.add("confetti");

      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.backgroundColor =
        colors[Math.floor(Math.random() * colors.length)];

      confetti.style.width =
        Math.random() * 8 + 6 + "px";

      confetti.style.height =
        Math.random() * 8 + 6 + "px";

      confetti.style.borderRadius =
        Math.random() > 0.5 ? "50%" : "2px";

      confetti.style.animationDuration =
        Math.random() * 3 + 2 + "s";

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 5000);
    }

    function celebrate() {
      // Big burst of confetti
      for (let i = 0; i < 180; i++) {
        setTimeout(() => {
          createConfetti();
        }, i * 8);
      }

      // Change button text
      const button = document.querySelector("button");
      button.innerHTML = "🎊 Best Birthday Ever! 🎊";

      setTimeout(() => {
        button.innerHTML = "🎉 Celebrate Again!";
      }, 4000);
    }

    // Continuous background confetti
    setInterval(createConfetti, 180);

    // Floating balloons
    const balloons = ["🎈", "🎈", "🎈", "🎈", "🎈"];

    balloons.forEach((emoji, index) => {
      const balloon = document.createElement("div");

      balloon.className = "balloon";
      balloon.innerHTML = emoji;

      balloon.style.left =
        Math.random() * 100 + "vw";

      balloon.style.animationDuration =
        Math.random() * 8 + 8 + "s";

      balloon.style.animationDelay =
        Math.random() * 5 + "s";

      document.body.appendChild(balloon);
    });

    // Initial celebration
    setTimeout(celebrate, 500);
  </script>

</body>
</html>
